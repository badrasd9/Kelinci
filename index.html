<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kelinci Melompat Edukasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #7DD3FC; /* Sky blue */
      --ground-color: #22C55E; /* Grass green */
      --ground-accent: #16A34A;
      --text-color: #0F172A;
      --panel-bg: rgba(255, 255, 255, 0.95);
    }
    
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    
    html {
      background-color: #0f172a; 
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100dvh; 
      margin: 0;
      padding: 0;
      overscroll-behavior: none; 
    }

    body {
      margin: 0; 
      padding: 0;
      width: 100%;
      height: 100%;
      max-width: 480px; 
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden; 
      position: relative;
      touch-action: none; 
      user-select: none; 
      -webkit-user-select: none;
      -webkit-touch-callout: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    @media (min-width: 481px) {
      body {
        height: 92%; 
        max-height: 850px;
        border-radius: 28px; 
        border: 8px solid #334155; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); 
      }
    }

    .screen {
      display: none; 
      width: 100%; 
      height: 100%; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    
    .screen.active { 
      display: flex; 
    }

    .glass-panel {
      background: var(--panel-bg);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 380px;
      backdrop-filter: blur(10px);
    }

    input {
      width: 100%;
      padding: 12px 16px;
      margin-top: 6px;
      margin-bottom: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #3b82f6; }

    button.btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button.btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .heart {
      width: 24px; height: 24px;
      background: #ef4444;
      position: relative;
      transform: rotate(-45deg);
      margin: 0 5px;
      transition: all 0.3s;
    }
    .heart::before, .heart::after {
      content: "";
      width: 24px; height: 24px;
      background: #ef4444;
      border-radius: 50%;
      position: absolute;
    }
    .heart::before { top: -12px; left: 0; }
    .heart::after { top: 0; left: 12px; }
    .heart.empty { filter: grayscale(1); opacity: 0.3; }

    #game-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; cursor: pointer; z-index: 1;
    }

    .bg-decor { position: absolute; border-radius: 50%; filter: blur(40px); z-index: 0; }
    .bg-decor-1 { top: -100px; left: -50px; width: 400px; height: 400px; background: rgba(255,255,255,0.4); }
    .bg-decor-2 { top: 50px; right: -100px; width: 300px; height: 300px; background: rgba(254,240,138,0.5); }
    
    #ground {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 20%;
      background: var(--ground-color);
    }
    #ground::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 20px;
      background: var(--ground-accent); opacity: 0.3;
    }
    
    #player {
      position: absolute; bottom: 20%; left: 15%;
      font-size: 4.5rem; line-height: 1; z-index: 5;
      transition: bottom 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      /* Hilangkan margin/padding yang mengganggu bounding box */
      margin: 0; padding: 0; display: block;
    }
    #player.jumping { bottom: calc(20% + 150px); }
    
    #obstacle {
      position: absolute; bottom: 20%; right: -80px; z-index: 4;
    }
    
    .obstacle-body {
      width: 40px; height: 60px;
      background: #854d0e;
      border-radius: 20px 20px 0 0;
      position: relative;
    }
    .obstacle-body::after {
      content: ''; position: absolute; top: -15px; left: 24px; width: 12px; height: 30px;
      background: #FCD34D; border-radius: 20px; border: 4px solid white; transform: rotate(10deg);
    }

    @keyframes moveLeft {
      0% { right: -80px; }
      100% { right: 100%; }
    }
    .moving {
      animation: moveLeft 1.5s linear infinite;
    }

    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; padding: 20px;
      display: flex; justify-content: space-between; align-items: flex-start;
      z-index: 8; pointer-events: none;
    }

    .option-btn {
      width: 100%; padding: 12px; margin-bottom: 10px;
      background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 1rem; text-align: left; cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { background: #e0f2fe; border-color: #bae6fd; }
    .option-btn.correct { background: #dcfce7; border-color: #86efac; color: #166534; }
    .option-btn.wrong { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
  </style>
</head>
<body>

  <div id="start-screen" class="screen active" style="background: var(--bg-color);">
    <div class="bg-decor bg-decor-1"></div>
    <div class="bg-decor bg-decor-2"></div>
    
    <div class="glass-panel relative z-10">
      <div class="text-center mb-6">
        <div class="text-6xl mb-2">🐰</div>
        <h1 class="text-2xl font-extrabold text-slate-800">Kelinci Melompat</h1>
        <p class="text-sm text-slate-500">Petualangan sambil belajar!</p>
      </div>
      
      <div class="mb-4">
        <label class="block text-sm font-bold text-slate-700">Nama Lengkap</label>
        <input type="text" id="input-nama" placeholder="Masukkan nama..." autocomplete="off">
      </div>
      
      <div class="mb-4">
        <label class="block text-sm font-bold text-slate-700">Kelas (Opsional)</label>
        <input type="text" id="input-kelas" placeholder="Contoh: 5A" autocomplete="off">
      </div>
      
      <div class="mb-6">
        <label class="block text-sm font-bold text-slate-700">Kode Soal (Dari Guru)</label>
        <input type="text" id="input-kode" placeholder="Masukkan nama tab soal..." autocomplete="off">
      </div>
      
      <button class="btn-primary" onclick="startGame()">Mulai Bermain</button>
      <div id="loading-start" class="hidden text-center mt-4 font-bold text-orange-500 text-sm">
        Memuat soal dari server...
      </div>
    </div>
  </div>

  <div id="game-screen" class="screen" style="background: transparent;">
    <div id="game-container" onclick="jump()">
      <div class="bg-decor bg-decor-1"></div>
      <div class="bg-decor bg-decor-2"></div>
      <div id="ground"></div>
      <div id="player">🐰</div>
      <div id="obstacle"><div class="obstacle-body"></div></div>
    </div>
    
    <div id="ui-layer">
      <div class="flex flex-col">
        <div class="text-xl font-black text-slate-800 drop-shadow-md" style="-webkit-text-stroke: 1px white;">
          Skor: <span id="score-display">0</span>
        </div>
        <div class="text-sm font-bold text-slate-600 bg-white/70 px-2 py-1 rounded-md mt-1">
          Lompatan: <span id="jump-count-display">0</span>/3
        </div>
      </div>
      <div class="flex" id="lives-display">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
      </div>
    </div>
    
    <div id="instruction-bar" class="absolute bottom-6 left-0 w-full text-center pointer-events-none z-10">
      <span class="bg-slate-800/70 text-white px-4 py-2 rounded-full font-bold text-sm tracking-wide shadow-lg backdrop-blur-sm">
        Ketuk Layar Untuk Melompat
      </span>
    </div>
  </div>

  <div id="question-screen" class="screen" style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);">
    <div class="glass-panel" style="width: 95%; max-width: 400px; padding: 1.5rem;">
      <div class="flex justify-between items-center mb-4">
        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
          Waktunya Kuis!
        </span>
        <span class="font-bold text-orange-500 flex items-center gap-1">
          ⏱️ <span id="timer-display">15</span>s
        </span>
      </div>
      
      <h2 id="question-text" class="text-lg font-bold text-slate-800 mb-6 leading-tight">
        Memuat pertanyaan...
      </h2>
      
      <div id="options-container" class="flex flex-col gap-2">
        <!-- Tombol opsi akan dibuat oleh JavaScript -->
      </div>
    </div>
  </div>

  <div id="game-over-screen" class="screen" style="background: rgba(15, 23, 42, 0.9);">
    <div class="glass-panel text-center">
      <div class="text-6xl mb-4">😿</div>
      <h2 class="text-3xl font-black text-slate-800 mb-2">Permainan Selesai!</h2>
      <p class="text-slate-600 mb-6">Hebat! Kamu sudah berusaha dengan baik.</p>
      
      <div class="bg-blue-50 border-2 border-blue-100 rounded-xl p-4 mb-6">
        <div class="text-sm text-slate-500 font-bold uppercase tracking-wider">Skor Akhir</div>
        <div id="final-score" class="text-5xl font-black text-blue-600">0</div>
      </div>
      
      <button class="btn-primary" onclick="resetGame()">Main Lagi</button>
    </div>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT-MU SENDIRI
    const API_URL = "https://script.google.com/macros/s/AKfycbz_K_N3_Xn9-n8_Xn9_Xn9_Xn9_Xn9_Xn9/exec"; 

    // DOM Elements
    const screens = {
      start: document.getElementById('start-screen'),
      game: document.getElementById('game-screen'),
      question: document.getElementById('question-screen'),
      gameOver: document.getElementById('game-over-screen')
    };
    
    const DOM = {
      player: document.getElementById('player'),
      obstacle: document.getElementById('obstacle'),
      score: document.getElementById('score-display'),
      jumpCount: document.getElementById('jump-count-display'),
      lives: document.getElementById('lives-display'),
      qText: document.getElementById('question-text'),
      options: document.getElementById('options-container'),
      timer: document.getElementById('timer-display'),
      finalScore: document.getElementById('final-score'),
      loading: document.getElementById('loading-start')
    };

    // Game State
    let state = {
      score: 0,
      lives: 3,
      jumpsCount: 0,
      jumpsToNextQuestion: 3,
      isJumping: false,
      gameLoop: null,
      obstaclePassed: false,
      questions: [],
      currentQuestion: null,
      timerInterval: null,
      timeLeft: 15,
      isPaused: false
    };

    async function fetchQuestions(kode) {
      // Untuk pratinjau ini, kita sediakan soal bawaan (fallback) jika API gagal/belum disetel
      const fallbackQuestions = [
        { pertanyaan: "Berapa 5 + 7?", opsi: ["10", "11", "12", "13"], jawaban: "12", poin: 10 },
        { pertanyaan: "Apa ibu kota Indonesia?", opsi: ["Bandung", "Jakarta", "Surabaya", "Bali"], jawaban: "Jakarta", poin: 10 },
        { pertanyaan: "Hewan apa yang mengeong?", opsi: ["Anjing", "Kucing", "Sapi", "Ayam"], jawaban: "Kucing", poin: 10 },
        { pertanyaan: "Berapa 10 - 4?", opsi: ["5", "6", "7", "8"], jawaban: "6", poin: 10 },
        { pertanyaan: "Warna daun yang sehat biasanya?", opsi: ["Merah", "Kuning", "Hijau", "Biru"], jawaban: "Hijau", poin: 10 }
      ];

      try {
        // Jika URL belum diganti, langsung gunakan soal lokal
        if(API_URL.includes("AKfycbz_K_N3")) {
          console.log("Menggunakan soal demo lokal...");
          return fallbackQuestions;
        }

        const response = await fetch(`${API_URL}?kode=${encodeURIComponent(kode)}`);
        const result = await response.json();
        
        if (result.status === 'success' && result.data.length > 0) {
          // Format data dari API ke format internal game
          return result.data.map(q => ({
            pertanyaan: q[1], // Asumsi kolom B
            opsi: [q[2], q[3], q[4], q[5]].filter(Boolean), // C, D, E, F
            jawaban: q[6], // G
            poin: q[7] || 10 // H
          }));
        }
        throw new Error(result.message || "Data kosong");
      } catch (error) {
        console.warn("Gagal mengambil soal dari Google Sheets, menggunakan soal cadangan.", error);
        return fallbackQuestions;
      }
    }

    function showScreen(screenName) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[screenName].classList.add('active');
    }

    async function startGame() {
      const nama = document.getElementById('input-nama').value.trim();
      const kode = document.getElementById('input-kode').value.trim();
      
      if (!nama) {
        alert("Silakan isi nama kamu terlebih dahulu!");
        return;
      }

      DOM.loading.classList.remove('hidden');
      document.querySelector('.btn-primary').disabled = true;

      // Ambil soal
      state.questions = await fetchQuestions(kode);
      // Acak urutan soal
      state.questions = state.questions.sort(() => Math.random() - 0.5);
      
      DOM.loading.classList.add('hidden');
      document.querySelector('.btn-primary').disabled = false;

      resetGameState();
      showScreen('game');
      startGameLoop();
    }

    function resetGameState() {
      state.score = 0;
      state.lives = 3;
      state.jumpsCount = 0;
      state.isPaused = false;
      updateUI();
      renderLives();
      
      DOM.obstacle.classList.add('moving');
      DOM.obstacle.style.animationDuration = '1.5s'; // Kecepatan awal rintangan
    }

    function jump() {
      if (state.isJumping || state.isPaused) return;
      
      state.isJumping = true;
      DOM.player.classList.add('jumping');
      
      // Tunggu animasi CSS selesai sebelum kelinci bisa melompat lagi
      setTimeout(() => {
        DOM.player.classList.remove('jumping');
        setTimeout(() => {
          state.isJumping = false;
        }, 300); // Waktu turun
      }, 300); // Waktu naik (sesuaikan dengan CSS transition player)
    }

    // Dukungan melompat pakai tombol Spasi di PC
    document.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'ArrowUp') && screens.game.classList.contains('active')) {
        jump();
      }
    });

    function startGameLoop() {
      if (state.gameLoop) clearInterval(state.gameLoop);
      
      state.gameLoop = setInterval(() => {
        if (state.isPaused) return;
        
        checkCollision();
      }, 50); // Cek benturan setiap 50ms
    }

    function checkCollision() {
      // Ambil posisi elemen secara real-time
      const playerRect = DOM.player.getBoundingClientRect();
      const obstacleRect = DOM.obstacle.getBoundingClientRect();
      
      // Hitung toleransi hitbox agar game tidak terlalu sulit (lebih fair)
      const hitToleransi = 15;
      
      // Cek apakah kotak kelinci dan kotak rintangan saling tumpang tindih
      const isColliding = !(
        playerRect.right - hitToleransi < obstacleRect.left || 
        playerRect.left + hitToleransi > obstacleRect.right || 
        playerRect.bottom - hitToleransi < obstacleRect.top || 
        playerRect.top + hitToleransi > obstacleRect.bottom
      );

      if (isColliding) {
        handleHit();
      } else {
        // Logika untuk mendeteksi apakah rintangan sukses dilewati
        // Membandingkan posisi kanan rintangan dengan posisi kiri kelinci
        if (obstacleRect.right < playerRect.left && !state.obstaclePassed) {
          state.obstaclePassed = true; // Tandai sudah dilewati agar tidak dihitung ganda
          state.jumpsCount++;
          updateUI();
          
          // Jika jumlah lompatan mencapai target, hentikan game dan munculkan pertanyaan
          if (state.jumpsCount >= state.jumpsToNextQuestion) {
            setTimeout(() => {
              triggerQuestion();
            }, 300); // Beri sedikit jeda agar animasi lompat selesai
          }
        }
        
        // Reset status saat rintangan sudah keluar layar di sebelah kiri
        // Gunakan clientWidth dari body agar hitungan dinamis sesuai layar
        if (obstacleRect.left > document.body.clientWidth || obstacleRect.left < 0) {
           if(obstacleRect.right < 0) {
               state.obstaclePassed = false;
           }
        }
      }
    }

    function handleHit() {
      state.isPaused = true;
      DOM.obstacle.classList.remove('moving');
      state.lives--;
      renderLives();
      
      DOM.player.textContent = "😵";
      
      if (state.lives <= 0) {
        setTimeout(gameOver, 1000);
      } else {
        // Efek kedip merah di layar jika tertabrak
        screens.game.style.backgroundColor = "rgba(239, 68, 68, 0.4)";
        setTimeout(() => {
          screens.game.style.backgroundColor = "transparent";
          DOM.player.textContent = "🐰";
          resetObstacleAndResume();
        }, 1500);
      }
    }

    function resetObstacleAndResume() {
      DOM.obstacle.style.animation = 'none';
      DOM.obstacle.offsetHeight; // Trigger reflow
      DOM.obstacle.style.animation = null;
      DOM.obstacle.classList.add('moving');
      state.obstaclePassed = false;
      state.isPaused = false;
    }

    function triggerQuestion() {
      state.isPaused = true;
      DOM.obstacle.classList.remove('moving');
      
      // Ambil soal dari urutan, jika habis putar dari awal
      if(state.questions.length === 0) return gameOver(); 
      state.currentQuestion = state.questions.shift();
      state.questions.push(state.currentQuestion); // Masukkan lagi ke belakang
      
      showQuestionScreen();
    }

    function showQuestionScreen() {
      showScreen('question');
      
      DOM.qText.textContent = state.currentQuestion.pertanyaan;
      DOM.options.innerHTML = '';
      
      // Render Pilihan Ganda
      state.currentQuestion.opsi.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(btn, opt);
        DOM.options.appendChild(btn);
      });

      // Mulai Hitung Mundur
      state.timeLeft = 15;
      DOM.timer.textContent = state.timeLeft;
      clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        DOM.timer.textContent = state.timeLeft;
        if (state.timeLeft <= 0) {
          clearInterval(state.timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function checkAnswer(btn, selected) {
      clearInterval(state.timerInterval);
      
      // Kunci semua tombol agar tidak bisa diklik dua kali
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);
      
      const isCorrect = (selected.toString().trim().toLowerCase() === state.currentQuestion.jawaban.toString().trim().toLowerCase());
      
      if (isCorrect) {
        btn.classList.add('correct');
        state.score += parseInt(state.currentQuestion.poin) || 10;
        
        // Persulit game perlahan: Rintangan makin cepat
        const currentSpeed = parseFloat(getComputedStyle(DOM.obstacle).animationDuration);
        if(currentSpeed > 0.8) {
           DOM.obstacle.style.animationDuration = (currentSpeed - 0.05) + 's';
        }
      } else {
        btn.classList.add('wrong');
        // Tunjukkan yang benar
        allBtns.forEach(b => {
          if (b.textContent.trim().toLowerCase() === state.currentQuestion.jawaban.toString().trim().toLowerCase()) {
            b.classList.add('correct');
          }
        });
        state.lives--;
        renderLives();
      }
      
      updateUI();
      
      // Jeda 2 detik agar anak bisa melihat jawaban benarnya, lalu lanjut
      setTimeout(() => {
        if (state.lives <= 0) {
          gameOver();
        } else {
          state.jumpsCount = 0; // Reset hitungan lompatan
          updateUI();
          showScreen('game');
          resetObstacleAndResume();
        }
      }, 2000);
    }

    function handleTimeOut() {
      // Sama seperti menjawab salah
      state.lives--;
      renderLives();
      
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => {
          b.disabled = true;
          if (b.textContent.trim().toLowerCase() === state.currentQuestion.jawaban.toString().trim().toLowerCase()) {
            b.classList.add('correct');
          }
      });

      setTimeout(() => {
        if (state.lives <= 0) {
          gameOver();
        } else {
          state.jumpsCount = 0;
          updateUI();
          showScreen('game');
          resetObstacleAndResume();
        }
      }, 2000);
    }

    function updateUI() {
      DOM.score.textContent = state.score;
      DOM.jumpCount.textContent = state.jumpsCount;
    }

    function renderLives() {
      const hearts = DOM.lives.children;
      for (let i = 0; i < hearts.length; i++) {
        if (i < state.lives) {
          hearts[i].classList.remove('empty');
        } else {
          hearts[i].classList.add('empty');
        }
      }
    }

    function gameOver() {
      clearInterval(state.gameLoop);
      clearInterval(state.timerInterval);
      state.isPaused = true;
      DOM.obstacle.classList.remove('moving');
      DOM.finalScore.textContent = state.score;
      showScreen('gameOver');
      
      // Di sini nanti bisa ditambahkan fungsi untuk mengirim skor (POST) ke Google Sheets
      // postScore(nama, kelas, score);
    }

    function resetGame() {
      showScreen('start');
    }

  </script>
</body>
</html>
