<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kelinci Melompat Edukasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #7DD3FC;
      --ground-color: #22C55E;
      --ground-accent: #16A34A;
      --text-color: #0F172A;
      --panel-bg: rgba(255, 255, 255, 0.95);
      --logical-width: 360px;
      --logical-height: 640px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100dvh;
      background-color: #0f172a;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; touch-action: none;
    }

    #app-container {
      width: var(--logical-width); height: var(--logical-height);
      background-color: var(--bg-color);
      position: relative; overflow: hidden;
      transform-origin: center center;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      border-radius: 0px;
    }

    @media (min-width: 480px) {
      #app-container { border-radius: 20px; border: 8px solid #334155; }
    }

    .screen {
      display: none; width: 100%; height: 100%;
      flex-direction: column; align-items: center; justify-content: center;
      position: absolute; top: 0; left: 0; z-index: 10;
    }
    .screen.active { display: flex; }

    .glass-panel {
      background: var(--panel-bg); padding: 1.25rem;
      border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 90%; backdrop-filter: blur(10px);
      max-height: 95%; overflow-y: auto;
    }

    input, select {
      width: 100%; padding: 8px 12px; margin-top: 2px; margin-bottom: 8px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s;
      background: white;
      user-select: text; -webkit-user-select: text;
    }
    input:focus, select:focus { border-color: #3b82f6; }

    button.btn-primary {
      width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white; border: none; padding: 12px;
      border-radius: 12px; font-size: 1rem; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: transform 0.1s;
    }
    button.btn-primary:active { transform: scale(0.96); }
    button.btn-primary:disabled { filter: grayscale(1); opacity: 0.7; pointer-events: none; }

    button.btn-secondary {
      width: 100%; background: #f1f5f9;
      color: #334155; border: 2px solid #e2e8f0; padding: 10px;
      border-radius: 12px; font-size: 0.85rem; font-weight: bold;
      cursor: pointer; margin-top: 8px;
    }
    button.btn-secondary:active { transform: scale(0.96); }

    .bg-decor { position: absolute; border-radius: 50%; filter: blur(30px); z-index: 0; }
    .bg-decor-1 { top: -50px; left: -50px; width: 250px; height: 250px; background: rgba(255,255,255,0.4); }
    .bg-decor-2 { top: 50px; right: -50px; width: 200px; height: 200px; background: rgba(254,240,138,0.5); }

    #ground {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 20%;
      background: var(--ground-color); z-index: 2;
    }
    #ground::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 12px;
      background: var(--ground-accent); opacity: 0.3;
    }

    #player {
      position: absolute; bottom: 20%; left: 40px;
      width: 60px; height: 60px;
      font-size: 3.5rem; line-height: 60px; text-align: center;
      z-index: 5; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #player.jumping { transform: translateY(-130px); }

    #obstacle {
      position: absolute; bottom: 20%; left: 100%; z-index: 4;
    }

    .obstacle-body {
      width: 36px; height: 50px; background: #854d0e;
      border-radius: 18px 18px 0 0; position: relative;
    }
    .obstacle-body::after {
      content: ''; position: absolute; top: -10px; left: 20px; width: 10px; height: 24px;
      background: #FCD34D; border-radius: 10px; border: 3px solid white; transform: rotate(10deg);
    }

    @keyframes moveLeft {
      0% { transform: translateX(50px); }
      100% { transform: translateX(-450px); }
    }
    .moving { animation: moveLeft 1.5s linear infinite; }

    .heart {
      width: 18px; height: 18px; background: #ef4444;
      position: relative; transform: rotate(-45deg); margin: 0 4px;
    }
    .heart::before, .heart::after {
      content: ""; width: 18px; height: 18px; background: #ef4444;
      border-radius: 50%; position: absolute;
    }
    .heart::before { top: -9px; left: 0; }
    .heart::after { top: 0; left: 9px; }
    .heart.empty { filter: grayscale(1); opacity: 0.3; }

    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; padding: 16px;
      display: flex; justify-content: space-between; align-items: flex-start;
      z-index: 8; pointer-events: none;
    }

    .option-btn {
      width: 100%; padding: 10px; margin-bottom: 8px;
      background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 0.9rem; font-weight: 600; text-align: left; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center;
    }
    .option-btn .opt-letter {
      background: #e2e8f0; color: #475569; width: 28px; height: 28px;
      display: flex; justify-content: center; align-items: center;
      border-radius: 6px; margin-right: 10px; font-weight: 900; flex-shrink: 0;
    }
    .option-btn.correct { background: #dcfce7; border-color: #86efac; color: #166534; }
    .option-btn.correct .opt-letter { background: #22c55e; color: white; }
    .option-btn.wrong { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
    .option-btn.wrong .opt-letter { background: #ef4444; color: white; }

    #message-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95); color: white; padding: 16px 20px;
      border-radius: 16px; font-weight: bold; z-index: 100;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
      text-align: center; width: 85%; font-size: 0.85rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); z-index: 50;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 0.85rem;
    }
    #loading-overlay.active { display: flex; }
    .spinner {
      width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="message-box">Pesan</div>
    <div id="loading-overlay"><div class="spinner"></div><div id="loading-text">Memuat soal dari server...</div></div>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
      <div class="bg-decor bg-decor-1"></div><div class="bg-decor bg-decor-2"></div>
      <div class="glass-panel relative z-10">
        <div class="text-center mb-2">
          <div class="text-5xl mb-1">🐰</div>
          <h1 class="text-xl font-extrabold text-slate-800">Kelinci Edukasi</h1>
          <p class="text-xs text-slate-500">Bermain & Belajar</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700">Nama Lengkap</label>
          <input type="text" id="input-nama" placeholder="Masukkan nama..." autocomplete="off">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700">Kelas (Opsional)</label>
          <input type="text" id="input-kelas" placeholder="Contoh: 5A" autocomplete="off">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700">Kode Soal / ID Sheet (Opsional)</label>
          <input type="text" id="input-kode" placeholder="Kosongkan = Soal Default" autocomplete="off">
        </div>
        <div class="mb-3">
          <label class="block text-xs font-bold text-slate-700">Kuis Muncul Setiap</label>
          <select id="select-freq">
            <option value="2">2 Lompatan Kelinci</option>
            <option value="3" selected>3 Lompatan Kelinci (Rekomendasi)</option>
            <option value="5">5 Lompatan Kelinci</option>
          </select>
        </div>

        <button id="btn-start" class="btn-primary" onclick="startGame()">Mulai Bermain</button>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
      <div id="game-area-clickable" style="position:absolute; width:100%; height:100%; z-index:9;" onclick="jump()"></div>
      <div class="bg-decor bg-decor-1"></div><div class="bg-decor bg-decor-2"></div>

      <div id="ground"></div>
      <div id="player">🐰</div>
      <div id="obstacle"><div class="obstacle-body"></div></div>

      <div id="ui-layer">
        <div class="flex flex-col">
          <div class="text-xl font-black text-slate-800" style="-webkit-text-stroke: 1px white;">
            Skor: <span id="score-display">0</span>
          </div>
          <div class="text-xs font-bold text-slate-600 bg-white/80 px-2 py-1 rounded-md mt-1 backdrop-blur-sm">
            Lompatan: <span id="jump-count-display">0</span>/<span id="target-jump-display">3</span>
          </div>
        </div>
        <div class="flex mt-2" id="lives-display">
          <div class="heart"></div><div class="heart"></div><div class="heart"></div>
        </div>
      </div>

      <div class="absolute bottom-6 left-0 w-full text-center pointer-events-none z-10">
        <span class="bg-slate-800/80 text-white px-4 py-2 rounded-full font-bold text-xs shadow-lg">
          Ketuk Layar Untuk Melompat
        </span>
      </div>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="question-screen" class="screen" style="background: rgba(15,23,42,0.9);">
      <div class="glass-panel" style="width: 90%;">
        <div class="flex justify-between items-center mb-2">
          <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-md">KUIS!</span>
        </div>
        <h2 id="question-text" class="text-sm font-bold text-slate-800 mb-3 leading-snug">
          Pertanyaan memuat...
        </h2>
        <div id="options-container" class="flex flex-col"></div>
      </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="screen" style="background: rgba(15, 23, 42, 0.95);">
      <div class="glass-panel text-center">
        <div class="text-5xl mb-2" id="game-over-icon">😿</div>
        <h2 class="text-xl font-black text-slate-800 mb-1">Permainan Selesai</h2>
        <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 my-2">
          <div class="text-xs text-slate-500 font-bold">SKOR AKHIR</div>
          <div id="final-score" class="text-3xl font-black text-blue-600">0</div>
        </div>

        <div id="submit-status" class="text-xs font-bold mt-2 mb-3 text-slate-500">
          Menyimpan nilai ke server...
        </div>

        <button class="btn-primary" onclick="resetGame()">Main Lagi</button>
      </div>
    </div>

    <!-- ERROR SCREEN (soal gagal dimuat dari sheet) -->
    <div id="error-screen" class="screen" style="background: rgba(15, 23, 42, 0.95);">
      <div class="glass-panel text-center">
        <div class="text-5xl mb-2">⚠️</div>
        <h2 class="text-lg font-black text-slate-800 mb-2">Soal Gagal Dimuat</h2>
        <p id="error-detail" class="text-xs text-slate-600 mb-3 leading-relaxed"></p>
        <button class="btn-primary" onclick="retryLoad()">Coba Lagi</button>
        <button class="btn-secondary" onclick="resetGame()">Kembali</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // URL Web App Apps Script (backend). Sudah diisi sesuai deployment Anda.
    // Jika Anda deploy ulang dan URL berubah, ganti nilai di bawah ini.
    // ============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycby76NuFNTNRW1C7GzwumaBquwQ0sAu02dJJHTNcVWanswuadjzVo-Uz1PomFKaQ0pk/exec";

    function scaleContainer() {
      const container = document.getElementById('app-container');
      const scale = Math.min(window.innerWidth / 360, window.innerHeight / 640);
      container.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', scaleContainer);
    scaleContainer();

    const DOM = {
      start: document.getElementById('start-screen'),
      game: document.getElementById('game-screen'),
      question: document.getElementById('question-screen'),
      gameOver: document.getElementById('game-over-screen'),
      error: document.getElementById('error-screen'),
      errorDetail: document.getElementById('error-detail'),
      loadingOverlay: document.getElementById('loading-overlay'),
      loadingText: document.getElementById('loading-text'),
      player: document.getElementById('player'),
      obstacle: document.getElementById('obstacle'),
      score: document.getElementById('score-display'),
      jumpCount: document.getElementById('jump-count-display'),
      targetJumpDisplay: document.getElementById('target-jump-display'),
      lives: document.getElementById('lives-display'),
      qText: document.getElementById('question-text'),
      options: document.getElementById('options-container'),
      finalScore: document.getElementById('final-score'),
      btnStart: document.getElementById('btn-start'),
      msgBox: document.getElementById('message-box'),
      submitStatus: document.getElementById('submit-status')
    };

    let state = {
      nama: "", kelas: "", kode: "",
      score: 0, lives: 3, jumpsCount: 0, jumpsToNextQuestion: 3,
      benar: 0, salah: 0, startTime: 0, detail: [],
      isJumping: false, gameLoop: null, obstaclePassed: false,
      questions: [], currentQuestion: null, isPaused: false,
      obstacleSpeed: 1.5
    };

    function showMsg(text, duration = 4000) {
      DOM.msgBox.innerHTML = text;
      DOM.msgBox.style.opacity = '1';
      setTimeout(() => DOM.msgBox.style.opacity = '0', duration);
    }

    function setLoading(active, text) {
      DOM.loadingOverlay.classList.toggle('active', active);
      if (text) DOM.loadingText.textContent = text;
    }

    /**
     * Mengambil soal dari backend GAS lewat GET ?action=getQuestions&sheetInput=...
     * Tidak lagi memakai data soal palsu (hardcode) sebagai pengganti diam-diam.
     * Jika gagal, melempar error agar UI menampilkan layar error yang jelas.
     */
    async function fetchQuestions(kode) {
      const fetchUrl = `${API_URL}?action=getQuestions&sheetInput=${encodeURIComponent(kode || '')}`;
      const response = await fetch(fetchUrl);
      const textData = await response.text();

      if (!textData || textData.trim() === "") {
        throw new Error("Server tidak mengirim data (respons kosong). Pastikan Web App sudah di-deploy ulang.");
      }

      if (textData.trim().startsWith("<!DOCTYPE") || textData.includes("Google Drive") || textData.includes("<html")) {
        throw new Error("Akses ke Google Sheet Soal dibatasi. Buka Sheet Soal → tombol 'Bagikan' → ubah ke 'Siapa saja yang memiliki link'.");
      }

      let result;
      try {
        result = JSON.parse(textData);
      } catch (e) {
        throw new Error("Format respons dari server tidak valid (bukan JSON).");
      }

      if (result && result.error) {
        throw new Error(result.error);
      }

      if (!Array.isArray(result) || result.length === 0) {
        throw new Error("Sheet soal kosong atau format kolom tidak sesuai (ID | Pertanyaan | A | B | C | D | Jawaban | Poin).");
      }

      return result.map(q => ({
        id: q.id || Math.random(),
        pertanyaan: q.pertanyaan,
        opsi: [
          { letter: 'A', text: q.a },
          { letter: 'B', text: q.b },
          { letter: 'C', text: q.c },
          { letter: 'D', text: q.d }
        ].filter(opt => opt.text !== undefined && opt.text !== ""),
        jawaban: q.jawaban ? q.jawaban.toString().trim().toUpperCase() : 'A',
        poin: parseInt(q.poin) || 10
      }));
    }

    function switchScreen(screen) {
      Object.values(DOM).forEach(el => {
        if (el && el.classList && el.classList.contains('screen')) el.classList.remove('active');
      });
      screen.classList.add('active');
    }

    async function loadQuestionsOrFail() {
      setLoading(true, "Memuat soal dari server...");
      try {
        state.questions = await fetchQuestions(state.kode);
        state.questions.sort(() => Math.random() - 0.5);
        setLoading(false);
        return true;
      } catch (error) {
        console.error("Fetch Error:", error);
        setLoading(false);
        DOM.errorDetail.textContent = error.message || "Terjadi kesalahan saat mengambil soal.";
        switchScreen(DOM.error);
        return false;
      }
    }

    async function retryLoad() {
      const ok = await loadQuestionsOrFail();
      if (ok) {
        resetGameState();
        switchScreen(DOM.game);
        startGameLoop();
      }
    }

    async function startGame() {
      state.nama = document.getElementById('input-nama').value.trim();
      state.kelas = document.getElementById('input-kelas').value.trim();
      state.kode = document.getElementById('input-kode').value.trim();
      state.jumpsToNextQuestion = parseInt(document.getElementById('select-freq').value) || 3;

      if (!state.nama) return showMsg("Silakan isi nama kamu terlebih dahulu!");

      DOM.btnStart.textContent = "Memuat Soal dari Server...";
      DOM.btnStart.disabled = true;

      const ok = await loadQuestionsOrFail();

      DOM.btnStart.textContent = "Mulai Bermain";
      DOM.btnStart.disabled = false;

      if (!ok) return; // layar error sudah ditampilkan oleh loadQuestionsOrFail

      resetGameState();
      switchScreen(DOM.game);
      startGameLoop();
    }

    function resetGameState() {
      state.score = 0; state.lives = 3; state.jumpsCount = 0;
      state.benar = 0; state.salah = 0; state.detail = [];
      state.startTime = Date.now();
      state.isPaused = false; state.obstacleSpeed = 1.5;
      DOM.targetJumpDisplay.textContent = state.jumpsToNextQuestion;
      updateUI(); renderLives();

      DOM.obstacle.classList.add('moving');
      DOM.obstacle.style.animationDuration = state.obstacleSpeed + 's';
    }

    function jump() {
      if (state.isJumping || state.isPaused) return;
      state.isJumping = true;
      DOM.player.classList.add('jumping');
      setTimeout(() => {
        DOM.player.classList.remove('jumping');
        setTimeout(() => { state.isJumping = false; }, 350);
      }, 350);
    }

    document.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'ArrowUp') && DOM.game.classList.contains('active')) {
        jump(); e.preventDefault();
      }
    });

    function startGameLoop() {
      if (state.gameLoop) clearInterval(state.gameLoop);
      state.gameLoop = setInterval(checkCollision, 30);
    }

    function checkCollision() {
      if (state.isPaused) return;

      const pBox = DOM.player.getBoundingClientRect();
      const oBox = DOM.obstacle.getBoundingClientRect();
      const hitToleransi = 15;

      const isColliding = !(
        pBox.right - hitToleransi < oBox.left ||
        pBox.left + hitToleransi > oBox.right ||
        pBox.bottom - hitToleransi < oBox.top ||
        pBox.top + hitToleransi > oBox.bottom
      );

      if (isColliding) {
        handleHit();
      } else {
        if (oBox.right < pBox.left && !state.obstaclePassed) {
          state.obstaclePassed = true;
          state.jumpsCount++;
          updateUI();

          if (state.jumpsCount >= state.jumpsToNextQuestion) {
            setTimeout(triggerQuestion, 200);
          }
        }
        if (oBox.right < 0) state.obstaclePassed = false;
      }
    }

    function handleHit() {
      state.isPaused = true;
      DOM.obstacle.classList.remove('moving');
      state.lives--; renderLives();
      DOM.player.textContent = "😵";

      if (state.lives <= 0) {
        setTimeout(gameOver, 800);
      } else {
        DOM.game.style.backgroundColor = "rgba(239, 68, 68, 0.4)";
        setTimeout(() => {
          DOM.game.style.backgroundColor = "transparent";
          DOM.player.textContent = "🐰";
          resetObstacleAndResume();
        }, 1200);
      }
    }

    function resetObstacleAndResume() {
      DOM.obstacle.style.animation = 'none';
      void DOM.obstacle.offsetWidth;
      DOM.obstacle.style.animation = null;
      DOM.obstacle.classList.add('moving');
      state.obstaclePassed = false;
      state.isPaused = false;
    }

    function triggerQuestion() {
      state.isPaused = true;
      DOM.obstacle.classList.remove('moving');

      if (state.questions.length === 0) return gameOver();
      state.currentQuestion = state.questions.shift();
      state.questions.push(state.currentQuestion);

      switchScreen(DOM.question);

      DOM.qText.textContent = state.currentQuestion.pertanyaan;
      DOM.options.innerHTML = '';

      state.currentQuestion.opsi.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.letter = opt.letter;
        btn.innerHTML = `<div class="opt-letter">${opt.letter}</div> <div>${opt.text}</div>`;
        btn.onclick = () => checkAnswer(btn, opt.letter);
        DOM.options.appendChild(btn);
      });
    }

    function checkAnswer(btn, selectedLetter) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      const isCorrect = (selectedLetter === state.currentQuestion.jawaban);

      state.detail.push({
        id: state.currentQuestion.id,
        jawaban: selectedLetter,
        benar: isCorrect
      });

      if (isCorrect) {
        btn.classList.add('correct');
        state.score += state.currentQuestion.poin;
        state.benar++;
        if (state.obstacleSpeed > 0.8) {
          state.obstacleSpeed -= 0.05;
          DOM.obstacle.style.animationDuration = state.obstacleSpeed + 's';
        }
      } else {
        btn.classList.add('wrong');
        state.salah++;
        allBtns.forEach(b => {
          if (b.dataset.letter === state.currentQuestion.jawaban) {
            b.classList.add('correct');
          }
        });
        state.lives--; renderLives();
      }

      updateUI();

      setTimeout(() => {
        if (state.lives <= 0) {
          gameOver();
        } else {
          state.jumpsCount = 0;
          updateUI();
          switchScreen(DOM.game);
          resetObstacleAndResume();
        }
      }, 1500);
    }

    function updateUI() {
      DOM.score.textContent = state.score;
      DOM.jumpCount.textContent = state.jumpsCount;
    }

    function renderLives() {
      const hearts = DOM.lives.children;
      for (let i = 0; i < hearts.length; i++) {
        if (i < state.lives) hearts[i].classList.remove('empty');
        else hearts[i].classList.add('empty');
      }
    }

    function gameOver() {
      clearInterval(state.gameLoop);
      state.isPaused = true;
      DOM.obstacle.classList.remove('moving');
      DOM.finalScore.textContent = state.score;
      switchScreen(DOM.gameOver);

      submitScoreToServer();
    }

    async function submitScoreToServer() {
      DOM.submitStatus.textContent = "Menyimpan nilai ke server...";
      DOM.submitStatus.className = "text-xs font-bold mt-2 mb-3 text-blue-600";

      const durasi = Math.floor((Date.now() - state.startTime) / 1000);

      const payload = {
        nama: state.nama,
        kelas: state.kelas,
        sheetInput: state.kode,
        skor: state.score,
        benar: state.benar,
        salah: state.salah,
        durasi: durasi,
        detail: state.detail
      };

      try {
        // PENTING: Content-Type harus text/plain agar tidak memicu preflight OPTIONS
        // yang tidak didukung Google Apps Script.
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (data.success) {
          DOM.submitStatus.textContent = "✅ Nilai berhasil disimpan di Sheet!";
          DOM.submitStatus.className = "text-xs font-bold mt-2 mb-3 text-green-600";
        } else {
          throw new Error(data.message || "Gagal disimpan");
        }
      } catch (error) {
        console.error("Gagal mengirim nilai:", error);
        DOM.submitStatus.textContent = "❌ Gagal menyimpan. Silakan screenshot nilaimu.";
        DOM.submitStatus.className = "text-xs font-bold mt-2 mb-3 text-red-600";
      }
    }

    function resetGame() {
      switchScreen(DOM.start);
    }
  </script>
</body>
</html>
